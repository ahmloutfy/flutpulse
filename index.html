---
layout: default
title: Home
---

<section class="hero">
  <div class="hero-text">
    <h1>Solve. Learn. <span>Build.</span></h1>
    <p>Fix Flutter issues with clear, practical solutions.</p>
  </div>
</section>

<div style="text-align: center; margin: 30px auto; max-width: 760px;">
  <ins class="adsbygoogle" style="display:inline-block; width:728px; height:90px;" data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="TOP_AD"></ins>
</div>

<div class="container">
  <h2>Latest Articles</h2>
  <div class="grid">
    {% for post in site.posts %}
    <div class="card">
      {% if post.image %}
        <img src="{{ post.image | relative_url }}" class="card-img" alt="{{ post.title }}">
      {% endif %}
      
      <div class="card-content">
        <h3>{{ post.title }}</h3>
        <p>{{ post.excerpt }}</p>
      </div>
      
      <a href="{{ post.url | relative_url }}" class="btn btn-primary">Read More</a>
    </div>
    {% endfor %}
  </div>
</div>
