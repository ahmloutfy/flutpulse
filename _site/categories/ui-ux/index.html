  <title>UI & UX | FlutPulse</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    /* Shared Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 1px solid #222;
    }
    nav img { height: 60px; }
    nav a {
      color: #ccc;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: 0.3s;
    }
    nav a:hover { color: #6cff6c; }
    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background: linear-gradient(90deg, #6cff6c, #ffd84d);
      transition: 0.3s;
    }
    nav a:hover::after { width: 100%; }

    /* ==================================================== */
    /* 1. Home Page Styles (Hero & Grid)                    */
    /* ==================================================== */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 30px;
      gap: 40px;
      flex-wrap: wrap;
    }
    .hero-text { flex: 1; min-width: 300px; margin-left: 80px; }
    .hero-logo { flex: 1; text-align: center; }
    .hero-logo img { width: 320px; max-width: 100%; filter: drop-shadow(0 0 20px #6cff6c); }
    .hero h1 { font-size: 42px; }
    .hero span { background: linear-gradient(90deg, #6cff6c, #ffd84d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #aaa; }

    .container { padding: 30px; }
    
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
      align-items: stretch;
    }
    .card {
      background: #121821;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-6px); }
    .card-img { width: 100%; height: 180px; object-fit: cover; display: block; }
    
    .card h3 { margin: 15px 15px 5px 15px; }
    .card p { 
      margin: 0 15px 15px 15px; 
      flex-grow: 1;
    }
    
    .card .btn { 
      margin: auto 15px 15px 15px;
    }

    .btn { padding: 10px 20px; margin-top: 10px; display: inline-block; border-radius: 6px; text-decoration: none; }
    .btn-primary { background: linear-gradient(90deg, #6cff6c, #ffd84d); color: #000; }
    .btn-secondary { border: 1px solid #6cff6c; color: #6cff6c; }

    /* Category Buttons */
    .categories-container, [class*="categories"] {
      display: flex !important;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin: 20px auto;
      padding: 10px;
    }

    .categories-container a, [class*="categories"] a {
      display: inline-block !important;
      background: #121821 !important;
      color: #fff !important;
      padding: 10px 20px !important;
      border-radius: 8px !important;
      text-decoration: none !important;
      font-weight: bold !important;
      border: 1px solid #222 !important;
      transition: 0.3s ease !important;
      white-space: nowrap !important;
    }

    .categories-container a:hover, [class*="categories"] a:hover {
      border-color: #6cff6c !important;
      color: #6cff6c !important;
      transform: translateY(-3px) !important;
      box-shadow: 0 5px 15px rgba(108, 255, 108, 0.2) !important;
    }

    /* Article Page Styles */
    .article-layout-wrapper {
      display: block;
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .article-image-box {
      text-align: center;
      margin-bottom: 40px;
      width: 100%;
    }

    .article-central-img {
      max-width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .article-main-content > h1:first-of-type {
      font-size: 38px;
      color: #fff;
      margin: 20px auto 25px auto;
      display: inline-flex !important;
      align-items: center;
      justify-content: center;
      white-space: normal !important;
      word-wrap: break-word !important;
      gap: 12px;
      width: auto;
      text-align: center;
    }

    @media (max-width: 600px) {
      .article-main-content > h1:first-of-type {
        font-size: 26px;
        white-space: normal !important;
      }
    }

    .article-main-content {
      font-size: 18px;
      line-height: 1.8;
      color: #e0e0e0;
      text-align: left;
    }

    pre {
      background: #080c11;
      padding: 20px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #1e2733;
    }
    code {
      color: #ffd84d;
      font-family: 'Consolas', monospace;
    }

    /* Footer */
    footer { background: #05080c; padding: 30px; text-align: center; color: #aaa; margin-top: 60px; }
    footer a { color: #6cff6c; text-decoration: none; }
  </style>
