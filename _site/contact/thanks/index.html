<script>
  // Add a language label to every Rouge block without changing article Markdown.
  document.querySelectorAll('.article-main-content div.highlighter-rouge').forEach(function (block) {
    var languageClass = Array.from(block.classList).find(function (className) {
      return className.indexOf('language-') === 0;
    });

    if (languageClass) {
      block.dataset.language = languageClass
        .replace('language-', '')
        .replace(/[-_]/g, ' ');
    }
  });
</script>
