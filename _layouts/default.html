<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | FlutPulse</title>
  <style>
    /* Global Styles */
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b0f14;
      color: #fff;
    }

    /* Shared Navbar */
    nav {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 15px 30px;
      border-bottom: 1px solid #222;
    }
    nav img { height: 60px; }
    nav a {
      color: #ccc;
      margin-left: 20px;
      text-decoration: none;
      font-weight: 500;
      position: relative;
      transition: 0.3s;
    }
    nav a:hover { color: #6cff6c; }
    nav a::after {
      content: "";
      position: absolute;
      width: 0;
      height: 2px;
      bottom: -4px;
      left: 0;
      background: linear-gradient(90deg, #6cff6c, #ffd84d);
      transition: 0.3s;
    }
    nav a:hover::after { width: 100%; }

    /* ==================================================== */
    /* 1. Home Page Styles (Hero & Grid)                    */
    /* ==================================================== */
    .hero {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 60px 30px;
      gap: 40px;
      flex-wrap: wrap;
    }
    .hero-text { flex: 1; min-width: 300px; margin-left: 80px; }
    .hero-logo { flex: 1; text-align: center; }
    .hero-logo img { width: 320px; max-width: 100%; filter: drop-shadow(0 0 20px #6cff6c); }
    .hero h1 { font-size: 42px; }
    .hero span { background: linear-gradient(90deg, #6cff6c, #ffd84d); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .hero p { color: #aaa; }

    .container { padding: 30px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: #121821;
      border-radius: 12px;
      overflow: hidden;
      transition: 0.3s;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      display: flex;
      flex-direction: column;
    }
    .card:hover { transform: translateY(-6px); }
    .card-img { width: 100%; height: 180px; object-fit: cover; display: block; }
    .card h3, .card p, .card .btn { margin: 15px; }

    .btn { padding: 10px 20px; margin-top: 10px; display: inline-block; border-radius: 6px; text-decoration: none; }
    .btn-primary { background: linear-gradient(90deg, #6cff6c, #ffd84d); color: #000; }
    .btn-secondary { border: 1px solid #6cff6c; color: #6cff6c; }

    /* 🔽 الـ CSS المفقود اللي هيخلي الكلمات ترجع أزرار فوراً 🔽 */
    .categories-section {
      text-align: center;
      padding: 40px 20px;
    }
    .categories-section h2 {
      font-size: 28px;
      margin-bottom: 20px;
    }
    .categories-container {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 15px;
    }
    .category-btn {
      background: #121821;
      color: #fff;
      padding: 12px 24px;
      border-radius: 8px;
      text-decoration: none;
      font-weight: bold;
      border: 1px solid #222;
      transition: 0.3s ease;
    }
    .category-btn:hover {
      border-color: #6cff6c;
      color: #6cff6c;
      transform: translateY(-3px);
      box-shadow: 0 5px 15px rgba(108, 255, 108, 0.2);
    }
    /* 🔼 الـ CSS المفقود اللي هيخلي الكلمات ترجع أزرار فوراً 🔼 */

    /* ==================================================== */
    /* 2. Central Article Page Styles (Centered Layout)     */
    /* ==================================================== */
    .article-layout-wrapper {
      display: block;
      max-width: 800px;
      margin: 50px auto;
      padding: 0 20px;
      box-sizing: border-box;
    }

    .article-image-box {
      text-align: center;
      margin-bottom: 40px;
      width: 100%;
    }

    .article-central-img {
      max-width: 100%;
      height: auto;
      max-height: 400px;
      object-fit: contain;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    /* Target ONLY the main article title */
    .article-main-content > h1:first-of-type {
      font-size: 38px;
      text-align: center !important;
      margin-top: 20px;
      margin-bottom: 25px;
      color: #fff;
      display: inline-block;
      width: 100%;
    }

    .article-main-content {
      font-size: 18px;
      line-height: 1.8;
      color: #e0e0e0;
      text-align: left;
    }

    /* Code Block Styles inside Articles */
    pre {
      background: #080c11;
      padding: 20px;
      border-radius: 10px;
      overflow-x: auto;
      border: 1px solid #1e2733;
    }
    code {
      color: #ffd84d;
      font-family: 'Consolas', monospace;
    }

    /* Shared Footer */
    footer { background: #05080c; padding: 30px; text-align: center; color: #aaa; margin-top: 60px; }
    footer a { color: #6cff6c; text-decoration: none; }
  </style>
</head>
<body>

<nav>
  <img src="{{ site.baseurl }}/flutpulse_logo.png" alt="FlutPulse Logo">
  <div>
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="#">Articles</a>
    <a href="#">Categories</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</nav>

{% if page.title == "Home" %}
  
  {{ content }}

{% else %}
  
  <div class="article-layout-wrapper">
    
    {% if page.image %}
    <div class="article-image-box">
      <img class="article-central-img" src="{{ page.image | relative_url }}" alt="{{ page.title }}">
    </div>
    {% endif %}

    <div class="article-main-content">
      {{ content }}
    </div>

  </div>

{% endif %}

{% if page.layout == "default" and page.title != "Home" %}
<div style="text-align: center; margin: 40px auto; max-width: 800px;">
  <span style="color: #444; font-size: 12px; display: block; margin-bottom: 5px;">Advertisement</span>
  <ins class="adsbygoogle"
       style="display:block; text-align:center;"
       data-ad-layout="in-article"
       data-ad-format="fluid"
       data-ad-client="ca-pub-XXXXXXXXXXXXXXXX"
       data-ad-slot="ZZZZZZZZZZ"></ins>
  <script>
       (adsbygoogle = window.adsbygoogle || []).push({});
  </script>
</div>
{% endif %}

<footer>
  <p>© 2026 FlutPulse. All rights reserved.</p>
  <p>
    <a href="https://www.facebook.com/flutpulse">Facebook</a> |
    <a href="mailto:flutpulse@proton.me">Contact</a>
  </p>
</footer>

</body>
</html>
