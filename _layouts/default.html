<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | FlutPulse</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: #0b0f14;
  color: #fff;
}

/* Navbar */
nav {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 15px 30px;
  border-bottom: 1px solid #222;
}

nav img {
  height: 60px;
}

nav a {
  color: #ccc;
  margin-left: 20px;
  text-decoration: none;
  font-weight: 500;
  position: relative;
  transition: 0.3s;
}

nav a:hover {
  color: #6cff6c;
}

nav a::after {
  content: "";
  position: absolute;
  width: 0;
  height: 2px;
  bottom: -4px;
  left: 0;
  background: linear-gradient(90deg, #6cff6c, #ffd84d);
  transition: 0.3s;
}

nav a:hover::after {
  width: 100%;
}

/* Hero */
.hero {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 60px 30px;
  gap: 40px;
  flex-wrap: wrap;
}

.hero-text {
  flex: 1;
  min-width: 300px;
  margin-left: 80px;
}

.hero-logo {
  flex: 1;
  text-align: center;
}

.hero-logo img {
  width: 320px;
  max-width: 100%;
  filter: drop-shadow(0 0 20px #6cff6c);
}

.hero h1 {
  font-size: 42px;
}

.hero span {
  background: linear-gradient(90deg, #6cff6c, #ffd84d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.hero p {
  color: #aaa;
}

/* Buttons */
.btn {
  padding: 10px 20px;
  margin-top: 10px;
  display: inline-block;
  border-radius: 6px;
  text-decoration: none;
}

.btn-primary {
  background: linear-gradient(90deg, #6cff6c, #ffd84d);
  color: #000;
}

.btn-secondary {
  border: 1px solid #6cff6c;
  color: #6cff6c;
}

/* Container */
.container {
  padding: 30px;
}

/* Grid */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
  gap: 20px;
}

/* Card */
.card {
  background: #121821;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
  box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  display: flex;
  flex-direction: column;
}

.card:hover {
  transform: translateY(-6px);
}

/* Card Image FIX */
.card-img {
  width: 100%;
  height: 180px;
  object-fit: cover;
  display: block;
}

/* Card content spacing */
.card h3 {
  margin: 15px;
}

.card p {
  margin: 0 15px 15px;
  color: #aaa;
}

.card .btn {
  margin: 0 15px 15px;
  width: fit-content;
}

/* Category */
.category {
  text-align: center;
  padding: 20px;
  background: #121821;
  border-radius: 10px;
}

/* Footer */
footer {
  background: #05080c;
  padding: 30px;
  text-align: center;
  color: #aaa;
  margin-top: 40px;
}

footer a {
  color: #6cff6c;
  text-decoration: none;
}
</style>

</head>
<body>

<nav>
  <img src="{{ site.baseurl }}/flutpulse_logo.png" alt="FlutPulse Logo">
  <div>
    <a href="{{ site.baseurl }}/">Home</a>
    <a href="#">Articles</a>
    <a href="#">Categories</a>
    <a href="#">About</a>
    <a href="#">Contact</a>
  </div>
</nav>

{{ content }}

<footer>
  <p>© 2026 FlutPulse. All rights reserved.</p>
  <p>
    <a href="https://www.facebook.com/flutpulse">Facebook</a> |
    <a href="mailto:flutpulse@proton.me">Contact</a>
  </p>
</footer>

</body>
</html>
