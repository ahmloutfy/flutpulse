<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | FlutPulse</title>
  <style>
    /* Global Reset & Base Styles */
    body { margin: 0; font-family: Arial, sans-serif; background: #0b0f14; color: #fff; }

    /* Navbar Styling */
    nav { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; border-bottom: 1px solid #222; }
    nav img { height: 60px; }
    nav a { color: #ccc; margin-left: 20px; text-decoration: none; font-weight: 500; position: relative; transition: 0.3s; }
    nav a:hover { color: #6cff6c; }
    
    /* Layout Wrapper */
    .article-layout-wrapper { display: block; max-width: 800px; margin: 50px auto; padding: 0 20px; }

    /* Article Title & Content Styles */
    .article-title { 
      font-size: 38px; color: #fff; margin: 20px auto 25px auto; 
      display: block !important; text-align: center; line-height: 1.2; 
      word-wrap: break-word; overflow-wrap: break-word; max-width: 100%; 
    }
    .article-main-content { font-size: 18px; line-height: 1.8; color: #e0e0e0; }
    pre { background: #080c11; padding: 20px; border-radius: 10px; overflow-x: auto; border: 1px solid #1e2733; }
    code { color: #ffd84d; font-family: 'Consolas', monospace; }

    /* Card Layout System */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; align-items: stretch; }
    .card { background: #121821; border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; height: 100%; transition: 0.3s; }
    .card-content { flex: 1; padding: 15px; }
    .card .btn { margin: 15px; margin-top: auto; }
    .btn { padding: 10px 20px; display: inline-block; border-radius: 6px; text-decoration: none; text-align: center; font-weight: bold; }
    .btn-primary { background: linear-gradient(90deg, #6cff6c, #ffd84d); color: #000; }

    /* Footer */
    footer { background: #05080c; padding: 30px; text-align: center; color: #aaa; margin-top: 60px; }
  </style>
</head>
<body>

<nav>
  <img src="{{ site.baseurl }}/flutpulse_logo.png" alt="FlutPulse Logo">
  <div><a href="{{ site.baseurl }}/">Home</a><a href="#">Articles</a></div>
</nav>

{% if page.title == "Home" %}
  {{ content }}
{% else %}
  <div class="article-layout-wrapper">
    <h1 class="article-title">{{ page.title }}</h1>
    
    <div class="article-main-content">
      {% assign paragraphs = content | split: "</p>" %}
      {% for para in paragraphs %}
        {{ para }}</p>
        {% if forloop.index == 2 %}
          <div style="text-align: center; margin: 35px auto;">
            <span style="color: #444; font-size: 11px; display: block;">Advertisement</span>
            <div style="width: 100%; max-width: 650px; position: relative; background: #121821; border: 1px dashed #263345; padding: 15px;">
              <ins class="adsbygoogle" style="display: block; width: 100%; height: 120px;" data-ad-format="fluid" data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="MID_AD"></ins>
            </div>
          </div>
        {% endif %}
      {% endfor %}
    </div>
  </div>
{% endif %}

{% if page.title != "Home" %}
<div style="text-align: center; margin: 45px auto;">
  <ins class="adsbygoogle" style="display:block; width:300px; height:250px; margin:0 auto;" data-ad-client="ca-pub-XXXXXXXX" data-ad-slot="END_AD"></ins>
</div>
{% endif %}

<script>(window.adsbygoogle = window.adsbygoogle || []).push({});</script>
</body>
</html>
